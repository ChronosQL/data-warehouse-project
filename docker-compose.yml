services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: dw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tours_dw
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create_metabase_db.sql:/docker-entrypoint-initdb.d/00_create_metabase_db.sql:ro
      - ./scripts/init_database.sql:/docker-entrypoint-initdb.d/01_init_database.sql:ro
      - ./scripts/init_database_data.sql:/docker-entrypoint-initdb.d/02_init_database_data.sql:ro
      - ./scripts/bronze/ddl_bronze.sql:/docker-entrypoint-initdb.d/03_ddl_bronze.sql:ro
      - ./scripts/bronze/proc_load_bronze.sql:/docker-entrypoint-initdb.d/04_proc_load_bronze.sql:ro
      - ./scripts/silver/ddl_silver.sql:/docker-entrypoint-initdb.d/05_ddl_silver.sql:ro
      - ./scripts/silver/proc_load_silver.sql:/docker-entrypoint-initdb.d/06_proc_load_silver.sql:ro
      - ./scripts/gold/ddl_gold.sql:/docker-entrypoint-initdb.d/07_ddl_gold.sql:ro
      - ./scripts/run_pipeline.sql:/docker-entrypoint-initdb.d/08_run_pipeline.sql:ro
      - ./datasets:/datasets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tours_dw"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dw_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

  metabase:
    image: metabase/metabase:latest
    container_name: dw_metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: admin
      MB_DB_PASS: admin123
      MB_DB_HOST: postgres
      MB_SETUP_TOKEN: "tours-dw-metabase-setup-token-2026"
      MB_SESSION_SECRET_KEY: "tours-dw-metabase-session-key-2026-secure-auth-3183"
      MB_EMOJI_IN_LOGS: "false"
      MB_ANONYMOUS_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      MB_DISABLE_DRIVERS: "bigquery-cloud-sdk,snowflake,sparksql,databricks,athena,druid-jdbc,redshift,vertica,clickhouse,oracle"
      JAVA_OPTS: "-Djava.security.egd=file:/dev/./urandom"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy

  metabase_init:
    image: curlimages/curl:latest
    container_name: dw_metabase_init
    restart: "no"
    depends_on:
      - metabase
    volumes:
      - ./scripts/metabase_init.sh:/metabase_init.sh:ro
    entrypoint: ["/bin/sh", "/metabase_init.sh"]

volumes:
  pgdata:
    driver: local
  pgadmin_data:
    driver: local
  metabase_data:
    driver: local
