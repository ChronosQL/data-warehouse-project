services:
  postgres:
    image: postgres:16-alpine
    container_name: dw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tours_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_database.sql:/docker-entrypoint-initdb.d/01_init_database.sql:ro
      - ./scripts/bronze/ddl_bronze.sql:/docker-entrypoint-initdb.d/02_ddl_bronze.sql:ro
      - ./scripts/bronze/proc_load_bronze.sql:/docker-entrypoint-initdb.d/03_proc_load_bronze.sql:ro
      - ./scripts/silver/ddl_silver.sql:/docker-entrypoint-initdb.d/04_ddl_silver.sql:ro
      - ./scripts/silver/proc_load_silver.sql:/docker-entrypoint-initdb.d/05_proc_load_silver.sql:ro
      - ./datasets:/datasets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tours_dw"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dw_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgdata:
    driver: local
  pgadmin_data:
    driver: local
